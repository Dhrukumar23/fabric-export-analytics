name: CI

# Every push and pull request: unit + end-to-end tests, semantic-model linting,
# PBIR schema validation, and a check that the committed PBIP matches its generator.
on:
  push:
    paths-ignore: ["data/**", "docs/**", "reports/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]" jsonschema referencing pyflakes
      - name: Static checks
        run: python -m pyflakes src tools tests fabric/deploy.py
      - name: Tests
        run: pytest -q
      - name: PBIP is generated from code (no hand edits drifted)
        run: |
          python tools/build_pbip.py
          git diff --exit-code -- powerbi/*.SemanticModel/definition powerbi/*.Report/definition
      - name: Semantic model best practices
        run: python tools/lint_model.py
      - name: Report definition matches Microsoft's PBIR schemas
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/microsoft/json-schemas.git /tmp/json-schemas
          git -C /tmp/json-schemas sparse-checkout set fabric
          python tools/validate_pbir.py /tmp/json-schemas
