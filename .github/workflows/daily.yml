name: Daily data load

# Every morning: pull yesterday's source extracts, run the contract-driven pipeline,
# commit the refreshed star schema (Power BI reads it from here), publish the web
# dashboard, and deploy to Microsoft Fabric when credentials are configured.
on:
  schedule:
    - cron: "15 5 * * *"        # 05:15 UTC = 06:15 / 07:15 in Germany
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "Rebuild everything from 2024-01-01"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-load
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run pipeline (ECB rates fetched live)
        run: |
          if [ "${{ inputs.bootstrap }}" = "true" ] || [ ! -f data/state/watermark.json ]; then
            exportlake bootstrap
          else
            exportlake daily
          fi

      - name: Tests and model checks
        run: |
          pytest -q
          python tools/lint_model.py

      - name: Commit refreshed data
        run: |
          git config user.name  "exportlake-bot"
          git config user.email "exportlake-bot@users.noreply.github.com"
          git add data/gold data/state data/quarantine reports docs
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: daily load $(date -u +%F)"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  pages:
    needs: load
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  fabric:
    needs: load
    runs-on: ubuntu-latest
    env:
      FABRIC_WORKSPACE_ID: ${{ secrets.FABRIC_WORKSPACE_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Deploy to Microsoft Fabric
        if: env.FABRIC_WORKSPACE_ID != ''
        run: |
          pip install -e ".[deploy]"
          python fabric/deploy.py
      - name: Skip (no Fabric credentials)
        if: env.FABRIC_WORKSPACE_ID == ''
        run: echo "Add FABRIC_WORKSPACE_ID and AZURE_* secrets to deploy to Fabric."
